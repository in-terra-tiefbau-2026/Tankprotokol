<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4621f">
<title>Tankprotokoll</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f1ea; --surface:#ffffff; --ink:#1f2a24; --muted:#5c6b63;
  --accent:#d4621f; --accent-ink:#ffffff; --line:#dedad0; --ok:#2f6b4f; --ok-bg:#e4efe8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1f1c; --surface:#242a25; --ink:#eee9df; --muted:#9fab9f;
    --accent:#e07a35; --accent-ink:#1b1206; --line:#39403a; --ok:#7fc79c; --ok-bg:#1f3129;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter","Segoe UI",system-ui,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:20px 60px;
}
.wrap{max-width:640px;margin:0 auto}
h1{font-size:clamp(24px,5vw,30px);font-weight:800;margin:0 0 4px;letter-spacing:-0.01em}
.sub{color:var(--muted);margin:0 0 22px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
label{display:block;font-weight:700;font-size:16px;margin:18px 0 8px}
label:first-of-type{margin-top:0}
.hint{font-weight:400;color:var(--muted);font-size:13px;display:block;margin-top:2px}
input, select{
  width:100%;font-size:19px;padding:14px 14px;border-radius:10px;border:2px solid var(--line);
  background:var(--bg);color:var(--ink);font-family:inherit;min-height:52px;
}
input:focus, select:focus{outline:3px solid color-mix(in srgb, var(--accent) 45%, transparent);outline-offset:1px;border-color:var(--accent)}
input[readonly]{background:var(--line);color:var(--muted);cursor:not-allowed}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.row2 > div{flex:1;min-width:140px}
#serial-wrap{margin-top:14px}
.diff-box{
  margin-top:18px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px 16px;
  font-size:15px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:10px;
}
.diff-box strong{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.upload-box{
  margin-top:4px;position:relative;border:2px dashed var(--line);border-radius:12px;background:var(--bg);
  min-height:90px;display:flex;align-items:center;justify-content:center;
}
.upload-box input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;min-height:90px}
.upload-placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600;padding:18px;text-align:center;pointer-events:none}
.upload-icon{font-size:26px}
.upload-preview{width:100%;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.upload-preview img{max-width:100%;max-height:220px;border-radius:8px;display:block}
.upload-remove{position:relative;z-index:2;background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.submit{width:100%;margin-top:22px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:18px;font-size:19px;font-weight:800;cursor:pointer}
.submit:disabled{opacity:.6;cursor:default}
.submit:active{transform:scale(.99)}
.msg{margin-top:12px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;text-align:center}
.msg[hidden]{display:none}
.err{color:#c0392b;font-weight:700;font-size:14px;margin-top:8px}
.err[hidden]{display:none}
h2{font-size:18px;margin:0 0 12px;font-weight:800}
.entry{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.entry:last-child{border-bottom:none}
.entry .left{display:flex;flex-direction:column;gap:3px;min-width:0}
.entry .left .top{font-weight:700}
.entry .left .bottom{color:var(--muted);font-size:13px}
.entry .amount{font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.entry .thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;flex-shrink:0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.summary-tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.summary-tile .m-name{font-size:14px;font-weight:700;color:var(--muted)}
.summary-tile .m-total{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.summary-tile .m-count{font-size:12px;color:var(--muted);margin-top:2px}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.export-btn{flex:1;min-width:160px;background:transparent;border:2px solid var(--line);color:var(--ink);border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.topbtns{display:flex;gap:8px;align-items:center}
.logout-btn,.lang-btn{background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.lang-btn.active{border-color:var(--accent);color:var(--accent)}
#login-screen{max-width:400px;margin:60px auto 0}
#login-screen h1{text-align:center}
#login-screen .sub{text-align:center}
#login-screen .topbtns{justify-content:center;margin-bottom:18px}
#app{display:none}
</style>
</head>
<body>

<div class="wrap" id="login-screen">
  <div class="topbtns">
    <button class="lang-btn" data-lang="de">DE</button>
    <button class="lang-btn" data-lang="ru">RU</button>
  </div>
  <h1>⛽ Tankprotokoll</h1>
  <p class="sub" data-i18n="loginSub">Bitte anmelden</p>
  <div class="card">
    <form id="login-form">
      <label for="login-email" data-i18n="loginEmail">E-Mail</label>
      <input type="email" id="login-email" required autocomplete="username">
      <label for="login-password" data-i18n="loginPassword">Passwort</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <p class="err" id="login-err" hidden></p>
      <button type="submit" class="submit" data-i18n="loginBtn">Anmelden</button>
    </form>
  </div>
</div>

<div class="wrap" id="app">
  <div class="topbar">
    <div>
      <h1>⛽ Tankprotokoll</h1>
      <p class="sub" style="margin:0" data-i18n="appSub">Bitte nach jeder Betankung ausfüllen.</p>
    </div>
    <div class="topbtns">
      <button class="lang-btn" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="logout-btn" id="logout-btn" data-i18n="logout">Abmelden</button>
    </div>
  </div>

  <div class="card">
    <form id="form">
      <label for="mitarbeiter" data-i18n="lMitarbeiter">Name (Mitarbeiter)</label>
      <input type="text" id="mitarbeiter" required>

      <label for="datum" data-i18n="lDatum">Datum</label>
      <input type="date" id="datum" required>

      <label for="baustelle" data-i18n="lBaustelle">Baustelle</label>
      <input type="text" id="baustelle" placeholder="z. B. Hannover, Dragonerstraße" required>

      <label for="tankquelle" data-i18n="lTankquelle">Tankquelle</label>
      <select id="tankquelle" required>
        <option value="" disabled selected data-i18n="optChoose">Bitte auswählen …</option>
        <option value="Tankwagen" data-i18n="optTankwagen">Tankwagen</option>
        <option value="DKV" data-i18n="optDKV">DKV-Karte</option>
      </select>

      <label for="machine" data-i18n="lMaschine">Maschine</label>
      <select id="machine" required>
        <option value="" disabled selected data-i18n="optChoose">Bitte auswählen …</option>
        <option value="Bagger" data-i18n="optBagger">Bagger</option>
        <option value="Radlader" data-i18n="optRadlader">Radlader</option>
        <option value="Dumper" data-i18n="optDumper">Dumper</option>
        <option value="LKW" data-i18n="optLKW">LKW</option>
        <option value="Erdrakete" data-i18n="optErdrakete">Erdrakete</option>
        <option value="Rüttelplatte" data-i18n="optRuettelplatte">Rüttelplatte</option>
      </select>

      <div id="serial-wrap">
        <label for="serial" data-i18n="lSeriennummer">Seriennummer der Maschine</label>
        <input type="text" id="serial" placeholder="z. B. RP-2024-118" required>
      </div>

      <div id="stand-wrap">
        <label for="stand" id="stand-label" data-i18n="lBetriebsstunden">Betriebsstunden vor dem Tanken</label>
        <input type="text" inputmode="decimal" id="stand" placeholder="z. B. 1234" required>
      </div>

      <label for="menge" data-i18n="lMenge">Betankungsmenge (Liter)</label>
      <input type="text" inputmode="decimal" id="menge" placeholder="z. B. 15" required>

      <label for="kartennummer" data-i18n="lKartennummer">Kartennummer (Tankkarte)</label>
      <input type="text" id="kartennummer" inputmode="numeric" placeholder="z. B. 1234" required>

      <div class="row2" id="tankwagen-wrap">
        <div>
          <label for="anfang" data-i18n="lAnfang">Tankwagen Anfang (Liter)</label>
          <input type="text" inputmode="decimal" id="anfang" placeholder="z. B. 500">
        </div>
        <div>
          <label for="ende" data-i18n="lEnde">Tankwagen Ende (Liter)<span class="hint" data-i18n="lEndeHint">wird automatisch berechnet</span></label>
          <input type="text" id="ende" placeholder="–" readonly tabindex="-1">
        </div>
      </div>

      <div class="diff-box" id="diff-box">
        <span data-i18n="diffLabel">Verbrauch Tankwagen (Anfang − Menge)</span>
        <strong id="diff-out">–</strong>
      </div>

      <label for="lieferschein" data-i18n="lLieferschein">Lieferschein (Foto)</label>
      <div class="upload-box" id="upload-box">
        <input type="file" id="lieferschein" accept="image/*" capture="environment">
        <div id="upload-placeholder" class="upload-placeholder">
          <span class="upload-icon">📷</span>
          <span data-i18n="uploadHint">Foto aufnehmen oder auswählen</span>
        </div>
        <div id="upload-preview" class="upload-preview" hidden>
          <img id="upload-img" alt="Lieferschein Vorschau">
          <button type="button" id="upload-remove" class="upload-remove" data-i18n="uploadRemove">Entfernen</button>
        </div>
      </div>

      <p class="err" id="err" hidden></p>
      <button type="submit" class="submit" data-i18n="saveBtn">Eintrag speichern</button>
      <p class="msg" id="ok" hidden></p>
    </form>
  </div>

  <div class="card">
    <h2 data-i18n="summaryTitle">Verbrauch pro Maschine</h2>
    <div id="summary"></div>
  </div>

  <div class="card">
    <h2 data-i18n="listTitle">Letzte Einträge</h2>
    <div id="list"></div>
    <div class="export-row">
      <button class="export-btn" id="export-btn" hidden data-i18n="exportText">Als Text kopieren</button>
      <button class="export-btn" id="export-csv-btn" hidden data-i18n="exportCsv">Als CSV kopieren (für Excel)</button>
      <button class="export-btn" id="export-pdf-btn" hidden data-i18n="exportPdf">Als PDF speichern</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="Lieferschein groß">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  var currentLang = (localStorage.getItem('tankprotokoll_lang') || 'de');

    restoreDraft();
  }

  supabase.auth.getSession().then(function(res){
    if(res.data && res.data.session){
      showApp();
    }
  });

  // ---------- Daten laden ----------
  function loadEntries(){
    supabase.from('entries').select('*').order('created_at', { ascending: false }).limit(500)
      .then(function(res){
        if(res.error){
          errEl.textContent = t('loadFailed') + res.error.message;
          errEl.hidden = false;
          return;
        }
        entriesCache = res.data || [];
        render();
      });
  }

  function subscribeRealtime(){
    supabase.channel('entries-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, function(){
        loadEntries();
      })
      .subscribe();
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear()+'-'+m+'-'+day;
  }

  // ---------- Entwurf-Sicherung (gegen Reload-Datenverlust) ----------
  var DRAFT_KEY = 'tankprotokoll_draft_v2';
  var draftFields = [mitarbeiterEl, datumEl, baustelleEl, tankquelleEl, machineEl, serialEl, standEl, mengeEl, kartennummerEl, anfangEl, endeEl];
  function saveDraft(){
    try{
      var draft = {};
      draftFields.forEach(function(el){ draft[el.id] = el.value; });
      localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    }catch(e){}
  }
  function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
  function restoreDraft(){
    try{
      var raw = localStorage.getItem(DRAFT_KEY);
      if(!raw) return;
      var draft = JSON.parse(raw);
      var hasContent = false;
      draftFields.forEach(function(el){
        if(draft[el.id]){
          el.value = draft[el.id];
          if(el.id !== 'datum') hasContent = true;
        }
      });
      if(hasContent){
        updateDiff();
        updateStandLabel();
        updateTankquelle();
        okEl.textContent = t('draftMsg');
        okEl.hidden = false;
      }
    }catch(e){}
  }
  draftFields.forEach(function(el){
    el.addEventListener('input', saveDraft);
    el.addEventListener('change', saveDraft);
  });

  function updateDiff(){
    var a = toNum(anfangEl.value);
    var m = toNum(mengeEl.value);
    if(isFinite(a) && isFinite(m)){
      var ende = Math.round((a - m) * 10) / 10;
      endeEl.value = ende;
      diffOut.textContent = ende.toLocaleString('de-DE',{maximumFractionDigits:1}) + ' l';
    } else {
      endeEl.value = '';
      diffOut.textContent = '–';
    }
  }
  anfangEl.addEventListener('input', updateDiff);
  mengeEl.addEventListener('input', updateDiff);

  function showPhotoPreview(dataUrl){
    currentPhotoDataUrl = dataUrl;
    uploadImg.src = dataUrl;
    uploadPlaceholder.hidden = true;
    uploadPreview.hidden = false;
  }
  function clearPhoto(){
    currentPhotoDataUrl = null;
    uploadImg.src = '';
    lieferscheinInput.value = '';
    uploadPlaceholder.hidden = false;
    uploadPreview.hidden = true;
  }
  function dataUrlToBlob(dataUrl){ return fetch(dataUrl).then(function(r){ return r.blob(); }); }

  function compressImage(file, callback){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var maxW = 1000;
        var scale = Math.min(1, maxW / img.width);
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function(){ callback(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  lieferscheinInput.addEventListener('change', function(){
    var file = lieferscheinInput.files && lieferscheinInput.files[0];
    if(!file) return;
    compressImage(file, function(dataUrl){ if(dataUrl) showPhotoPreview(dataUrl); });
  });
  uploadRemove.addEventListener('click', function(ev){ ev.preventDefault(); clearPhoto(); });

  function fmtDate(iso){
    var p = String(iso).split('-');
    if(p.length !== 3) return iso;
    return p[2]+'.'+p[1]+'.'+p[0];
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderSummary(entries){
    if(entries.length === 0){
      summaryEl.innerHTML = '<p class="empty">' + t('noData') + '</p>';
      return;
    }
    var totals = {};
    entries.forEach(function(en){
      if(!totals[en.maschine]) totals[en.maschine] = {sum:0, count:0};
      totals[en.maschine].sum += Number(en.menge_liter) || 0;
      totals[en.maschine].count += 1;
    });
    var names = Object.keys(totals).sort(function(a,b){ return totals[b].sum - totals[a].sum; });
    summaryEl.innerHTML = '<div class="summary-grid">' + names.map(function(name){
      var t2 = totals[name];
      return '<div class="summary-tile">' +
        '<div class="m-name">' + escapeHtml(name) + '</div>' +
        '<div class="m-total">' + t2.sum.toLocaleString('de-DE',{maximumFractionDigits:1}) + ' l</div>' +
        '<div class="m-count">' + t2.count + '×</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function standText(en){
    if(en.betriebsstunden != null) return Number(en.betriebsstunden).toLocaleString('de-DE',{maximumFractionDigits:1}) + ' h';
    if(en.kilometerstand != null) return Number(en.kilometerstand).toLocaleString('de-DE',{maximumFractionDigits:1}) + ' km';
    return '';
  }
  var tqLabel = { Tankwagen:'Tankwagen', DKV:'DKV-Karte' };

  function render(){
    var entries = entriesCache;
    renderSummary(entries);
    if(entries.length === 0){
      listEl.innerHTML = '<p class="empty">' + t('noEntries') + '</p>';
      exportBtn.hidden = true; exportCsvBtn.hidden = true; exportPdfBtn.hidden = true;
      return;
    }
    exportBtn.hidden = false; exportCsvBtn.hidden = false; exportPdfBtn.hidden = false;
    listEl.innerHTML = entries.map(function(en){
      var photoUrl = en.lieferschein_path
        ? supabase.storage.from(BUCKET).getPublicUrl(en.lieferschein_path).data.publicUrl
        : '';
      var standStr = standText(en);
      return '<div class="entry">' +
        '<div class="left">' +
          '<span class="top">' + escapeHtml(en.maschine) + ' · ' + escapeHtml(en.seriennummer) + '</span>' +
          '<span class="bottom">' + fmtDate(en.datum) + ' — ' + escapeHtml(en.baustelle) + ' · ' + escapeHtml(tqLabel[en.tankquelle] || en.tankquelle || '–') +
            (en.kartennummer ? ' · Karte ' + escapeHtml(en.kartennummer) : '') +
            (standStr ? ' · ' + standStr : '') +
            (en.mitarbeiter ? ' · ' + escapeHtml(en.mitarbeiter) : '') + '</span>' +
        '</div>' +
        (photoUrl ? '<img class="thumb" src="' + photoUrl + '" alt="Lieferschein" data-full="' + photoUrl + '">' : '') +
        '<div class="amount">' + Number(en.menge_liter).toLocaleString('de-DE',{maximumFractionDigits:1}) + ' l</div>' +
      '</div>';
    }).join('');
  }

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  listEl.addEventListener('click', function(e){
    var th = e.target.closest('.thumb');
    if(!th) return;
    lightboxImg.src = th.dataset.full;
    lightbox.hidden = false;
  });
  lightbox.addEventListener('click', function(){ lightbox.hidden = true; lightboxImg.src = ''; });

  function resetForm(){
    baustelleEl.value = ''; tankquelleEl.value = ''; machineEl.value = ''; serialEl.value = ''; standEl.value = ''; mengeEl.value = '';
    kartennummerEl.value = ''; anfangEl.value = ''; endeEl.value = ''; diffOut.textContent = '–';
    updateStandLabel();
    updateTankquelle();
    clearPhoto(); clearDraft(); baustelleEl.focus();
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    errEl.hidden = true; okEl.hidden = true;

    var mitarbeiter = mitarbeiterEl.value.trim();
    var datum = datumEl.value;
    var baustelle = baustelleEl.value.trim();
    var tankquelle = tankquelleEl.value;
    var istTankwagen = tankquelle === 'Tankwagen';
    var machine = machineEl.value;
    var serial = serialEl.value.trim();
    var stand = toNum(standEl.value);
    var istKm = KM_MASCHINEN.indexOf(machine) !== -1;
    var menge = toNum(mengeEl.value);
    var kartennummer = kartennummerEl.value.trim();
    var anfang = istTankwagen ? toNum(anfangEl.value) : null;
    var ende = istTankwagen ? toNum(endeEl.value) : null;

    if(!mitarbeiter || !datum || !baustelle || !tankquelle || !machine || !serial || !isFinite(stand) || !isFinite(menge) || !kartennummer){
      errEl.textContent = t('fillAll');
      errEl.hidden = false;
      return;
    }
    if(istTankwagen && (!isFinite(anfang) || !isFinite(ende))){
      errEl.textContent = t('needAnfang');
      errEl.hidden = false;
      return;
    }
    if(istTankwagen && ende > anfang){
      errEl.textContent = t('endeTooBig');
      errEl.hidden = false;
      return;
    }

    var submitBtn = form.querySelector('.submit');
    submitBtn.disabled = true;
    submitBtn.textContent = t('saving');

    function finish(){
      okEl.textContent = t('savedMsg'); okEl.hidden = false;
      submitBtn.disabled = false; submitBtn.textContent = t('saveBtn');
      resetForm();
    }
    function fail(msg){
      errEl.textContent = msg; errEl.hidden = false;
      submitBtn.disabled = false; submitBtn.textContent = t('saveBtn');
    }

    var photoPromise = currentPhotoDataUrl
      ? dataUrlToBlob(currentPhotoDataUrl).then(function(blob){
          var path = Date.now() + '_' + Math.random().toString(36).slice(2) + '.jpg';
          return supabase.storage.from(BUCKET).upload(path, blob, { contentType: 'image/jpeg' })
            .then(function(res){
              if(res.error) return null;
              return path;
            });
        })
      : Promise.resolve(null);

    photoPromise.then(function(photoPath){
      return supabase.from('entries').insert({
        datum: datum, mitarbeiter: mitarbeiter, baustelle: baustelle, tankquelle: tankquelle,
        maschine: machine, seriennummer: serial,
        betriebsstunden: istKm ? null : stand,
        kilometerstand: istKm ? stand : null,
        menge_liter: menge, kartennummer: kartennummer,
        tankwagen_anfang: anfang, tankwagen_ende: ende,
        lieferschein_path: photoPath
      });
    }).then(function(res){
      if(res.error){
        fail(t('saveFailed') + res.error.message);
        return;
      }
      finish();
      loadEntries();
    }).catch(function(e){
      fail(t('saveFailedRetry'));
    });
  });

  exportBtn.addEventListener('click', function(){
    var entries = entriesCache;
    var lines = entries.map(function(en){
      return [fmtDate(en.datum), en.mitarbeiter, en.baustelle, 'Quelle: '+(tqLabel[en.tankquelle] || en.tankquelle || '–'), en.maschine, en.seriennummer,
        standText(en) ? ('Zähler: ' + standText(en)) : '',
        'Menge: '+en.menge_liter+' l', 'Karte: '+en.kartennummer,
        en.tankquelle === 'Tankwagen' ? ('Anfang: '+en.tankwagen_anfang+' l | Ende: '+en.tankwagen_ende+' l') : '',
        en.lieferschein_path ? 'Beleg: ja' : 'Beleg: nein'].filter(Boolean).join(' | ');
    });
    var text = lines.join('\n');
    function fallbackSelect(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(fallbackSelect);
    } else { fallbackSelect(); }
    var old = exportBtn.textContent;
    exportBtn.textContent = t('copied');
    setTimeout(function(){ exportBtn.textContent = old; }, 1800);
  });

  function csvCell(v){
    var s = String(v == null ? '' : v);
    if(/[;"\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  exportCsvBtn.addEventListener('click', function(){
    var entries = entriesCache;
    var header = ['Datum','Mitarbeiter','Baustelle','Tankquelle','Maschine','Seriennummer','Betriebsstunden','Kilometerstand','Menge (l)','Kartennummer','Anfang (l)','Ende (l)','Beleg vorhanden'];
    var rows = entries.map(function(en){
      return [fmtDate(en.datum), en.mitarbeiter, en.baustelle, tqLabel[en.tankquelle] || en.tankquelle, en.maschine, en.seriennummer,
        en.betriebsstunden, en.kilometerstand, en.menge_liter, en.kartennummer, en.tankwagen_anfang, en.tankwagen_ende,
        en.lieferschein_path ? 'ja' : 'nein']
        .map(csvCell).join(';');
    });
    var csv = header.join(';') + '\n' + rows.join('\n');
    function fallbackSelect(){
      var ta = document.createElement('textarea');
      ta.value = csv; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv).catch(fallbackSelect);
    } else { fallbackSelect(); }
    var old = exportCsvBtn.textContent;
    exportCsvBtn.textContent = t('copied');
    setTimeout(function(){ exportCsvBtn.textContent = old; }, 1800);
  });

  exportPdfBtn.addEventListener('click', function(){
    var entries = entriesCache;
    if(!entries.length) return;
    if(!window.jspdf || !window.jspdf.jsPDF){
      errEl.textContent = t('pdfFail');
      errEl.hidden = false;
      return;
    }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var marginX = 14; var y = 16;

    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('Tankprotokoll Baustelle', marginX, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110,110,110);
    doc.text('Erstellt am ' + new Date().toLocaleDateString('de-DE'), marginX, y + 6);
    doc.setTextColor(0,0,0); y += 16;

    var cols = [
      {label:'Datum', w:16},{label:'Mitarbeiter', w:22},{label:'Baustelle', w:24},{label:'Quelle', w:16},{label:'Maschine', w:18},{label:'Seriennr.', w:18},
      {label:'Std./km', w:16},
      {label:'Menge (l)', w:16},{label:'Kartennr.', w:16},{label:'Anfang (l)', w:16},{label:'Ende (l)', w:14}
    ];
    var rowH = 8;

    function drawHeader(){
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.setFillColor(212,98,31); doc.setTextColor(255,255,255);
      doc.rect(marginX, y, pageW - marginX*2, rowH, 'F');
      var x = marginX;
      cols.forEach(function(c){ doc.text(c.label, x + 2, y + rowH/2 + 1.2); x += c.w; });
      doc.setTextColor(0,0,0); y += rowH;
    }

    drawHeader();
    doc.setFont('helvetica','normal'); doc.setFontSize(9);

    entries.forEach(function(en, i){
      if(y + rowH > doc.internal.pageSize.getHeight() - 14){
        doc.addPage(); y = 16; drawHeader();
        doc.setFont('helvetica','normal'); doc.setFontSize(9);
      }
      if(i % 2 === 0){
        doc.setFillColor(246,243,236);
        doc.rect(marginX, y, pageW - marginX*2, rowH, 'F');
      }
      var istTW = en.tankquelle === 'Tankwagen';
      var vals = [
        fmtDate(en.datum), en.mitarbeiter || '–', en.baustelle, tqLabel[en.tankquelle] || en.tankquelle || '–', en.maschine, en.seriennummer,
        standText(en) || '–',
        String(en.menge_liter),
        en.kartennummer || '–',
        istTW ? String(en.tankwagen_anfang) : '–', istTW ? String(en.tankwagen_ende) : '–'
      ];
      var x = marginX;
      vals.forEach(function(v, idx){
        var w = cols[idx].w;
        var text = doc.splitTextToSize(String(v), w - 4)[0] || '';
        doc.text(text, x + 2, y + rowH/2 + 1.2);
        x += w;
      });
      doc.setDrawColor(222,218,208);
      doc.line(marginX, y + rowH, pageW - marginX, y + rowH);
      y += rowH;
    });

    var filename = 'tankprotokoll_' + todayISO() + '.pdf';
    doc.save(filename);
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  applyLang();
})();
</script>
</body>
</html>
